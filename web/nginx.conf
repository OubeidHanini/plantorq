server {
    listen 8080;
    root /usr/share/nginx/html;

    # Single origin for the browser: the API and its WebSocket are proxied,
    # so no CORS is needed and the JWT never crosses origins.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host keeps the port: the API compares it with the browser's
        # Origin header to reject cross-site WebSocket connections.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
