# Local development stack.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # once; edit the secrets
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Dashboard:  http://localhost:3000  (admin@acme.io / $SEED_DEMO_PASSWORD)
#
# Every value comes from .env (next to this file). Secrets have no default:
# Compose refuses to start until they are set, so none is ever committed.

name: plantorq

x-go-service: &go-service
  restart: unless-stopped
  environment: &go-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    MQTT_BROKER: tcp://mosquitto:1883
    MQTT_USERNAME: ${MQTT_USERNAME:-}
    MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    DATABASE_URL: postgres://${POSTGRES_USER:-plantorq}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}@postgres:5432/${POSTGRES_DB:-plantorq}?sslmode=disable
    INFLUX_URL: http://influxdb:8086
    INFLUX_DB: ${INFLUX_DB:-plantorq}

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports: ["127.0.0.1:1883:1883"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantorq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-plantorq}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantorq}"]
      interval: 5s
      retries: 10

  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB: ${INFLUX_DB:-plantorq}
      INFLUXDB_HTTP_LOG_ENABLED: "false"
    volumes: [influxdb-data:/var/lib/influxdb]

  simulator:
    build: ../../simulator
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}

  edge-agent:
    <<: *go-service
    build: { context: ../.., args: { SERVICE: edge-agent } }
    environment:
      <<: *go-env
      AGENT_CONFIG: /etc/plantorq/agent.yaml
      MODBUS_ADDRESS: simulator:5020
    volumes:
      - ../config/agent.yaml:/etc/plantorq/agent.yaml:ro
      - agent-buffer:/data
    depends_on: [simulator, mosquitto]

  ingestor:
    <<: *go-service
    build: { context: ../.., args: { SERVICE: ingestor } }
    environment:
      <<: *go-env
      BATCH_SIZE: ${INGEST_BATCH_SIZE:-500}
      FLUSH_INTERVAL: ${INGEST_FLUSH_INTERVAL:-1s}
      QUEUE_SIZE: ${INGEST_QUEUE_SIZE:-20000}
    depends_on: [mosquitto, influxdb]

  rules-engine:
    <<: *go-service
    build: { context: ../.., args: { SERVICE: rules-engine } }
    environment:
      <<: *go-env
      RULE_RELOAD_INTERVAL: ${RULE_RELOAD_INTERVAL:-15s}
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }

  api:
    <<: *go-service
    build: { context: ../.., args: { SERVICE: api } }
    environment:
      <<: *go-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/compose/.env}
      JWT_TTL: ${JWT_TTL:-12h}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }

  analytics:
    build: ../../analytics
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MQTT_BROKER: tcp://mosquitto:1883
      WATCHED_METRICS: ${ANALYTICS_WATCHED_METRICS:-vibration}
      WINDOW: ${ANALYTICS_WINDOW:-120}
    depends_on: [mosquitto]

  web:
    build: ../../web
    restart: unless-stopped
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [api]

volumes:
  mosquitto-data:
  postgres-data:
  influxdb-data:
  agent-buffer:
