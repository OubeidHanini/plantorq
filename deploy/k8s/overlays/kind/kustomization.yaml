# Local / CI cluster: images are built locally and loaded with `kind load`,
# so they use the :dev tag and are never pulled from a registry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
# Throwaway demo secrets so local and CI clusters need no setup.
secretGenerator:
  - name: plantorq-secrets
    envs: [demo-secrets.env]
generatorOptions:
  disableNameSuffixHash: true
images:
  - { name: ghcr.io/oubeidhanini/plantorq-api, newName: plantorq/api, newTag: dev }
  - { name: ghcr.io/oubeidhanini/plantorq-ingestor, newName: plantorq/ingestor, newTag: dev }
  - { name: ghcr.io/oubeidhanini/plantorq-rules-engine, newName: plantorq/rules-engine, newTag: dev }
  - { name: ghcr.io/oubeidhanini/plantorq-edge-agent, newName: plantorq/edge-agent, newTag: dev }
  - { name: ghcr.io/oubeidhanini/plantorq-analytics, newName: plantorq/analytics, newTag: dev }
  - { name: ghcr.io/oubeidhanini/plantorq-simulator, newName: plantorq/simulator, newTag: dev }
  - { name: ghcr.io/oubeidhanini/plantorq-web, newName: plantorq/web, newTag: dev }
patches:
  # One replica each is plenty on a laptop or a CI runner.
  - target: { kind: HorizontalPodAutoscaler }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: Deployment, name: "api|web|ingestor" }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
