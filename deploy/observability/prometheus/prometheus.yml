# Prometheus configuration for Docker Compose: static targets by service name.
# Kubernetes uses prometheus-k8s.yml, which discovers pods instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: edge-agent
    static_configs: [{ targets: ["edge-agent:9100"] }]
  - job_name: ingestor
    static_configs: [{ targets: ["ingestor:9101"] }]
  - job_name: rules-engine
    static_configs: [{ targets: ["rules-engine:9102"] }]
  - job_name: api
    static_configs: [{ targets: ["api:9103"] }]
  - job_name: analytics
    static_configs: [{ targets: ["analytics:9104"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
