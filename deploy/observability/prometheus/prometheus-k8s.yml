# Prometheus configuration for Kubernetes: scrape every pod in the namespace
# that opts in with the prometheus.io/scrape and prometheus.io/port
# annotations (already set on all Plantorq workloads).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: plantorq-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [plantorq] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # job = the app label, so dashboards and alerts work unchanged in
      # Compose and Kubernetes.
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
