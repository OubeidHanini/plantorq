name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go · lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with: { version: latest }
      - name: Test (race detector + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  opcua-interop:
    name: OPC UA · Go reader ↔ Python server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Start the simulated OPC UA server
        run: |
          pip install ./simulator
          python -c "import asyncio; from plantorq_simulator.opcua_server import OpcUaPlant;             from plantorq_simulator.profiles import WeldingRobot;             asyncio.run(OpcUaPlant({'robot-07': WeldingRobot()}).serve('127.0.0.1', 4840))" &
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/4840) 2>/dev/null; do sleep 1; done'
      - name: Read it with the Go adapter
        env: { PLANTORQ_OPCUA_ENDPOINT: "opc.tcp://127.0.0.1:4840" }
        run: go test -v -run TestAgainstRealServer ./internal/adapters/opcua/

  python:
    name: Python · lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics, simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install ruff -e "./${{ matrix.service }}[dev]"
      - run: ruff check ${{ matrix.service }} && ruff format --check ${{ matrix.service }}
      - run: pytest -q
        working-directory: ${{ matrix.service }}

  web:
    name: Web · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  observability:
    name: Observability · config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus configs and alert rules
        run: |
          for cfg in prometheus.yml prometheus-k8s.yml; do
            docker run --rm -v "$PWD/deploy/observability/prometheus:/etc/prometheus"               --entrypoint promtool prom/prometheus:v2.54.1 check config /etc/prometheus/$cfg
          done
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool deploy/observability/grafana/dashboards/plantorq-platform.json > /dev/null

  images:
    name: Build images
    needs: [go, python, web, observability, opcua-interop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., args: SERVICE=api }
          - { name: ingestor, context: ., args: SERVICE=ingestor }
          - { name: rules-engine, context: ., args: SERVICE=rules-engine }
          - { name: edge-agent, context: ., args: SERVICE=edge-agent }
          - { name: analytics, context: analytics, args: "" }
          - { name: simulator, context: simulator, args: "" }
          - { name: web, context: web, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image owner (registry names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/plantorq-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/plantorq-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: Deploy to kind & smoke test
    needs: [go, python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          for s in api ingestor rules-engine edge-agent; do
            docker build -q --build-arg SERVICE=$s -t plantorq/$s:dev .
          done
          docker build -q -t plantorq/analytics:dev analytics
          docker build -q -t plantorq/simulator:dev simulator
          docker build -q -t plantorq/web:dev web
      - uses: helm/kind-action@v1
        with: { cluster_name: plantorq }
      - name: Load images into kind
        run: |
          for s in api ingestor rules-engine edge-agent analytics simulator web; do
            kind load docker-image plantorq/$s:dev --name plantorq
          done
      - name: Deploy
        run: |
          kubectl apply -k deploy/k8s/overlays/kind
          kubectl -n plantorq rollout status statefulset/postgres --timeout=180s
          for d in mosquitto simulator api ingestor rules-engine edge-agent web; do
            kubectl -n plantorq rollout status deployment/$d --timeout=180s
          done
      - name: Smoke test (login, live data, alert pipeline)
        run: |
          kubectl -n plantorq port-forward svc/web 8080:80 >/dev/null 2>&1 &
          sleep 5
          # Single source of truth for the demo password: the kind overlay's secrets.
          PASSWORD=$(grep '^SEED_DEMO_PASSWORD=' deploy/k8s/overlays/kind/demo-secrets.env | cut -d= -f2-)
          TOKEN=$(curl -sf -X POST localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@acme.io\",\"password\":\"$PASSWORD\"}" | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != null
          # Edge agent -> MQTT -> API: machines must report live values.
          for i in $(seq 1 30); do
            ONLINE=$(curl -sf localhost:8080/api/v1/machines -H "Authorization: Bearer $TOKEN" \
              | jq '[.[] | select(.status != "offline")] | length')
            [ "$ONLINE" -ge 4 ] && break
            sleep 2
          done
          echo "machines online: $ONLINE"
          test "$ONLINE" -ge 4
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n plantorq get pods -o wide
          kubectl -n plantorq logs deploy/api --tail=50 || true
          kubectl -n plantorq logs deploy/edge-agent --tail=50 || true
