[project]
name = "plantorq-analytics"
version = "1.0.0"
description = "Streaming anomaly detection for Plantorq"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3", "prometheus-client>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
